name: Android

on:
  push:
    branches: [main]
    # Pushing a version tag builds, signs and publishes a release.
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      make_release:
        description: "Create a GitHub Release with the APK?"
        type: boolean
        required: true
        default: false
      version:
        description: "Release tag (e.g. v1.0.0)"
        required: false
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Lint
        run: ./gradlew :app:lintDebug

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      # Signs the release build only when the repo has a keystore in secrets.
      # Without them the job still produces the debug APK above.
      - name: Decode release keystore
        id: keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}"
            echo "keyAlias=${{ secrets.KEY_ALIAS }}"
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
          } > keystore.properties
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        if: ${{ steps.keystore.outputs.signed == 'true' }}
        run: ./gradlew :app:assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release APK
        if: ${{ steps.keystore.outputs.signed == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk

      - name: Release notes
        id: notes
        if: ${{ steps.keystore.outputs.signed == 'true' && ((github.event_name == 'workflow_dispatch' && github.event.inputs.make_release == 'true') || startsWith(github.ref, 'refs/tags/v')) }}
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name }}
        run: |
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [ -f "release-notes/$TAG.md" ]; then
            cp "release-notes/$TAG.md" "$RUNNER_TEMP/notes.md"
          else
            echo "TG WS Proxy Android $TAG" > "$RUNNER_TEMP/notes.md"
          fi

      - name: Create GitHub Release
        if: ${{ steps.notes.outputs.tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.notes.outputs.tag }}
          name: "TG WS Proxy Android ${{ steps.notes.outputs.tag }}"
          body_path: ${{ runner.temp }}/notes.md
          files: app/build/outputs/apk/release/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
